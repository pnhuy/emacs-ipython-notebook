name: CI

on:
  pull_request:
    paths-ignore:
    - '**.md'
    - '**.rst'
  push:
    paths-ignore:
    - '**.md'
    - '**.rst'
    branches-ignore:
    - 'master'

jobs:
  # Cask-free batch harness (Makefile targets deps, test-*, lint).
  # The README "CI VERSION" is the lowest numeric emacs_version here.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        emacs_version: [29.1, release-snapshot]
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: emacs ${{ matrix.emacs_version }}
      uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}

    - name: jupyter
      run: pip install jupyter_server ipykernel nbformat

    - name: deps
      run: make deps

    - name: test-compile
      run: make test-compile

    - name: test-unit
      run: make test-unit

    - name: test-integration
      run: make test-integration

    - name: lint
      run: make lint

  # Optional: the original Cask-based suite, kept for comparison.
  legacy:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        emacs_version: [29.1]
        python-version: [3.8]

    steps:
    - uses: actions/checkout@v4

    - name: python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: nix
      uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}

    - uses: actions/cache@v4
      id: cache-cask-packages
      with:
        path: .cask
        key: cache-cask-packages-001

    - uses: actions/cache@v4
      id: cache-cask-executable
      with:
        path: ~/.cask
        key: cache-cask-executable-001

    - uses: cask/setup-cask@master
      if: steps.cache-cask-executable.outputs.cache-hit != 'true'
      with:
          version: snapshot

    - name: paths
      run: |
        echo "$HOME/.cask/bin" >> $GITHUB_PATH

    - name: test-mem-constrained
      run: |
        pip install yq
        make quick
